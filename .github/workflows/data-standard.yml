name: Validate canonical data and static pages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: |
          python -m pip install jsonschema==4.26.0
          npm install --prefix "$RUNNER_TEMP/atlas-tests" jsdom@26.1.0
          echo "NODE_PATH=$RUNNER_TEMP/atlas-tests/node_modules" >> "$GITHUB_ENV"
      - name: Validate owned records, schemas, references and projections
        run: |
          python tools/data_catalog.py --check
          python tests/validate_data_structure.py
          python tests/validate_category_taxonomy.py
          python tests/validate_catalogs.py
          python tests/validate_hardware_bom.py
          python tests/validate_bom_metadata.py
          python tests/validate_software_ram_migration.py
          python tests/validate_athena.py
          python tests/validate_cost_consolidation.py
          python tests/validate_comdex82_costs.py
          python tests/validate_ecosystem_forecast.py
      - name: Check preserved page content and interactive consumers
        run: |
          node tests/site-organization.test.cjs
          node tests/artemis-configurator.test.cjs
          node tests/computer-families.test.cjs
          node tests/bom-navigator.test.cjs
          node tests/category-taxonomy.test.cjs
          node tests/domain-navigators.test.cjs
          node tests/navigator-table.test.cjs
          node tests/page-content.test.cjs
          node --test tests/architecture-layout.test.cjs tests/costs.test.cjs tests/ecosystem.test.cjs tests/market-share.test.cjs tests/pricing.test.cjs tests/roi.test.cjs tests/sales.test.cjs tests/specification.test.cjs tests/timeline.test.cjs
