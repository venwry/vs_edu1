sk development milestone. Proposed campaign: <strong>A clear view of your next design.</strong><br>Autodesk AutoCAD on Logix Artemis PRO. From drawing to plotted output.</p>
<h2>Proposed campaign</h2><p><strong>A clear view of your next design.</strong><br>Bring a drawing. See it on Artemis. Take home the plot.</p><ul><li>See the drawing clearly: Native 800x600 drawing area on the 17-inch screen, four shades selected from 16 levels, static CAD palette and demonstrated line quality.</li><li>Keep commands and drawing in view: Colour command/status display alongside the dedicated drawing screen, with explicit keyboard/mouse focus.</li><li>Take the drawing beyond the screen: Save, reopen, exchange and plot the same test drawing; verify coordinates and output scale.</li><li>Buy an application with a supported platform: Autodesk application support and Logix hardware/integration support, qualified configurations, dealer training and a clear upgrade route.</li></ul>
<h2>12-minute live demonstration</h2><ul><li>0-2 minutes: Open a representative mechanical or floor-plan drawing from disk; show the command screen and drawing screen together.</li><li>2-5 minutes: Create and edit supported lines/arcs using typed coordinates and mouse input. Use only commands present in the qualified AutoCAD 1.0 build.</li><li>5-7 minutes: Pan/zoom and compare ordinary versus antialiased line rendering at the same scale. State measured redraw behaviour; do not promise arbitrary real-time performance.</li><li>7-9 minutes: Save and reopen the drawing, demonstrate tested exchange, and show the resulting plot.</li><li>9-12 minutes: Explain complete-system and existing-owner upgrade routes, support ownership, and book an evaluation.</li></ul><p>Run a small live plot; disclose any larger pre-plotted sample as such. Do not imply a long plot completes within a short demonstration.</p>
<h2>Schedule and follow-up</h2><ul><li>1982-09: Use the existing Autodesk beta programme for reference workflows and qualified customer feedback; no second overlapping beta event.</li><li>1982-10: Train selected dealers, rehearse the demo, confirm the plotter driver and prepare press materials.</li><li>1982-11 before COMDEX: Invite technical press and qualified prospects; offer scheduled demos and customer-drawing evaluations.</li><li>1982-11-29: Joint presentation, supervised trials and dealer meetings; accept orders only against explicit configuration and delivery terms.</li><li>1982-12: Telephone/postal follow-up within five business days, regional evaluations, delivery acceptance and early-customer training.</li><li>1983-01 to 1983-02: Publish approved customer case studies and measured support findings; review conversion and product defects.</li></ul>
<h2>Campaign allocation</h2><p>Proposal allocation only; dollar envelope to be costed after booth, staffing, hardware and Autodesk co-marketing terms are agreed.</p><ul><li>Booth and live demo: 30%</li><li>Demo equipment shipping and spares: 15%</li><li>Staff travel and dealer training: 20%</li><li>Press materials and customer invitations: 10%</li><li>Regional evaluations and followup: 15%</li><li>Contingency: 10%</li></ul><p>Separate from the $253000 NCC campaign provision. Credit shared staff and reused demo equipment; do not charge capital twice or invent sales uplift. Team Edition adoption subsidy remains separate unit economics.</p>
<h2>Measure outcomes</h2><ul><li>Qualified demonstrations with named organisation, workload and next step</li><li>Evaluations completed and customer acceptance findings</li><li>Written quotes and conversion to delivered, accepted installations</li><li>Dealers trained and reference configurations qualified</li><li>Support workload, defects, file-exchange problems and plot accuracy</li></ul>
