<!doctype html><html lang="en"><head><base href="../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Source data</title><script src="data-store.js"></script><style>body{font:16px system-ui;margin:2rem;max-width:1000px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f6f8;padding:1rem}li{margin:.5rem 0}</style></head><body><h1>Source data</h1><p>This view reads the authoritative collections directly. No generated catalogue file is stored.</p><ul id="sources"></ul><button id="download" disabled>Download this view</button><pre id="content">Loading…</pre><script>
(async()=>{try{const name=new URLSearchParams(location.search).get('view'),reg=await fetch('schemas/data-registry.json').then(r=>r.json());if(!reg.views[name])throw Error('Unknown data view');document.querySelector('h1').textContent=name;for(const file of DataStore.filesFor(name,reg)){const li=document.createElement('li'),a=document.createElement('a');a.href=file;a.textContent=file;li.append(a);document.getElementById('sources').append(li);}const response=await DataStore.fetch('catalog:'+name),value=await response.json(),text=JSON.stringify(value,null,2);document.getElementById('content').textContent=text;const button=document.getElementById('download');button.disabled=false;button.onclick=()=>{const url=URL.createObjectURL(new Blob([text+'\n'],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};}catch(e){document.getElementById('content').textContent=e.message;}})();
</script></body></html>
